// Mismo backend y mismos códigos que finanzas-cafeteros (Railway)
const API_BASE = "https://doc-comite-finanzas-production.up.railway.app/api";

async function apiGet(ruta, code) {
  const r = await fetch(API_BASE + ruta, { headers: { "X-Code": code } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({})))?.error || "Error de conexión");
  return r.json();
}
async function apiPut(ruta, code, body) {
  const r = await fetch(API_BASE + ruta, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Code": code },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({})))?.error || "Error de conexión");
  return r.json();
}
async function apiDelete(ruta, code) {
  const r = await fetch(API_BASE + ruta, { method: "DELETE", headers: { "X-Code": code } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({})))?.error || "Error de conexión");
  return r.json();
}
async function apiPost(ruta, code, body) {
  const r = await fetch(API_BASE + ruta, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Code": code },
    body: JSON.stringify(body || {})
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({})))?.error || "Error de conexión");
  return r.json();
}

  ph:               { ideal: [5.0, 5.5],   unidad: "pH",    fuente: "Cenicafé" },
};

function semaforo(campo, valor) {
  if (valor === "" || valor === null) return null;
  const v = parseFloat(valor);
  if (isNaN(v)) return null;
  const r = REF[campo];
  if (!r) return null;
  const [lo, hi] = r.ideal;
  if (v >= lo && v <= hi) return "ok";
  const margen = (hi - lo) * 0.25;
  if (v >= lo - margen && v <= hi + margen) return "warn";
  return "alert";
}

function generarRecomendaciones(d) {
  const recs = [];
  const add = (p, area, titulo, texto, impacto) => recs.push({ prioridad: p, area, titulo, texto, impacto });

  const s_rojos = semaforo("pctRojos", d.pctRojos);
  if (s_rojos === "alert") add(1, "Cosecha", "Recolección selectiva urgente",
    `Tu proporción de frutos rojos (${d.pctRojos}%) está muy por debajo del 95% ideal. Cada fruto verde o sobremaduro genera defectos en cascada: peor conversión, más pasilla y puntaje SCA más bajo.`,
    "Alto impacto en calidad y merma");
  else if (s_rojos === "warn") add(2, "Cosecha", "Mejorar selectividad en cosecha",
    `Con ${d.pctRojos}% de frutos rojos estás cerca del límite. Una segunda pasada 5-7 días después suele elevar este porcentaje sin aumentar el jornal total.`,
    "Impacto medio en calidad");

  const fv = parseFloat(d.fermentacion);
  const s_ferm = semaforo("fermentacion", d.fermentacion);
  if (s_ferm === "alert" && fv < 12) add(1, "Beneficio", "Fermentación insuficiente",
    `${d.fermentacion}h es poco. El mucílago no se degrada bien y el pergamino puede quedar con residuos que generan notas terrosas o astringencia en taza.`,
    "Alto impacto en puntaje SCA");
  else if (s_ferm === "alert" && fv > 24) add(1, "Beneficio", "Sobrefermentación — riesgo crítico",
    `${d.fermentacion}h supera el rango seguro (12-24h). La sobrefermentación genera notas vinosas que pueden restar 4+ puntos SCA por taza afectada.`,
    "Alto impacto en puntaje SCA");

  const hv = parseFloat(d.humedadPergamino);
  const s_hum = semaforo("humedadPergamino", d.humedadPergamino);
  if (s_hum === "alert" && hv > 12) add(1, "Secado", "Humedad excesiva — riesgo de hongos",
    `Con ${d.humedadPergamino}% el café está en zona de riesgo de hongos y pérdida de peso. Extender el secado y remover más frecuentemente.`,
    "Alto impacto en merma y calidad");
  else if (s_hum === "alert" && hv < 10) add(2, "Secado", "Exceso de secado — pérdida evitable",
    `Con ${d.humedadPergamino}% estás secando de más. Cada punto por debajo del óptimo es peso vendible que se pierde sin ningún beneficio.`,
    "Impacto medio en merma");

  const s_rel = semaforo("relacionCereza", d.relacionCereza);
  if (s_rel === "alert" && parseFloat(d.relacionCereza) > 5.5) add(2, "Cosecha + Beneficio", "Relación de conversión alta",
    `Necesitas ${d.relacionCereza} kg de cereza por 1 kg de pergamino (ideal 4,5-5,5:1). Indica mezcla de fruto verde, fermentación deficiente o secado irregular.`,
    "Impacto directo en rentabilidad");

  const s_trilla = semaforo("mermaTrilla", d.mermaTrilla);
  if (s_trilla === "alert" && parseFloat(d.mermaTrilla) > 20) add(2, "Trilla", "Merma en trilla superior al estándar",
    `Con ${d.mermaTrilla}% de merma (estándar FNC: 19%) probablemente hay grano partido por trilladora descalibrada o defectos físicos previos.`,
    "Impacto medio en volumen vendible");

  const s_pas = semaforo("pctPasilla", d.pctPasilla);
  if (s_pas === "alert") add(2, "Trilla / Beneficio", "Porcentaje de pasilla alto",
    `${d.pctPasilla}% de pasilla supera el rango esperado (0-8%). Se forma por defectos de cosecha (frutos verdes, brocados) o grano partido en trilla.`,
    "Impacto en ingresos netos");

  const s_hr = semaforo("hrAlmacen", d.hrAlmacen);
  if (s_hr === "alert" && parseFloat(d.hrAlmacen) > 70) add(2, "Almacenamiento", "Humedad relativa alta en bodega",
    `Con ${d.hrAlmacen}% de HR el café absorbe humedad y puede desarrollar hongos. Mejorar ventilación, usar sacos de fique y separar del suelo sobre estibas.`,
    "Impacto en pérdida de peso y calidad");

  const sv = parseFloat(d.puntajeSCA);
  if (d.puntajeSCA !== "" && sv < 80) add(1, "Calidad en taza", "Café fuera del rango de especialidad",
    `Con ${d.puntajeSCA} puntos el café no alcanza el umbral SCA (80 pts). La causa más frecuente son defectos evitables: fruto verde en cosecha y fermentación descontrolada.`,
    "Crítico para acceder a precio premium");
  else if (d.puntajeSCA !== "" && sv >= 80 && sv < 84) add(2, "Calidad en taza", "Especialidad básico — hay margen de mejora",
    `Con ${d.puntajeSCA} puntos estás en especialidad básico. Las mejoras de manejo pueden mover el puntaje a 84-86, lo que significa +0,20 a +0,50 USD/lb adicionales.`,
    "Impacto directo en precio de venta");

  const s_ph = semaforo("ph", d.ph);
  if (s_ph === "alert" && parseFloat(d.ph) < 5.0) add(2, "Suelo", "Suelo muy ácido",
    `Con pH ${d.ph} el suelo está por debajo del rango ideal (5,0-5,5). La acidez excesiva limita la disponibilidad de fósforo y puede liberar aluminio tóxico para la raíz.`,
    "Impacto en nutrición y productividad");
  else if (s_ph === "alert" && parseFloat(d.ph) > 5.5) add(2, "Suelo", "Suelo poco ácido para café",
    `Con pH ${d.ph} el suelo está por encima del rango ideal. Puede reducir la disponibilidad de hierro, zinc y manganeso.`,
    "Impacto en nutrición");

  if (d.pctSombra === "0" || d.pctSombra === "sin") add(3, "Suelo y clima", "Cultivo a plena exposición sin sombra",
    `Sin sombrío, el cafetal es más vulnerable a la sequía, estrés térmico y desgaste prematuro de la planta, especialmente en variedades tradicionales.`,
    "Impacto en sostenibilidad y longevidad del cafetal");

  if (Array.isArray(d.plagasObservadas) && d.plagasObservadas.length > 0) {
    const altaSeveridad = d.plagasObservadas.filter(id => {
      const p = PLAGAS.find(x => x.id === id);
      return p && p.severidad >= 4;
    });
    if (altaSeveridad.length > 0) add(1, "Fitosanitario", "Plagas/enfermedades de alto impacto presentes",
      `Marcaste ${altaSeveridad.map(id => PLAGAS.find(p => p.id === id).nombre).join(", ")}. Revisa la pestaña Plagas para ver umbral de acción y métodos de control recomendados por Cenicafé/FNC.`,
      "Alto impacto económico potencial");
  }

  if (recs.length === 0) add(0, "General", "✓ Indicadores en rango ideal",
    "Todos los datos introducidos están dentro de los rangos de referencia. Continúa con las prácticas actuales y documenta los procesos para garantizar consistencia entre cosechas.",
    "Mantener y documentar");

  return recs.sort((a, b) => a.prioridad - b.prioridad);
}

function IndicadorBar({ label, valor, campo }) {
  const s = semaforo(campo, valor);
  const r = REF[campo];
  const v = parseFloat(valor);
  let pct = null;
  if (!isNaN(v) && r) {
    const [lo, hi] = r.ideal;
    const min = lo * 0.5; const max = hi * 1.5;
    pct = Math.min(100, Math.max(2, ((v - min) / (max - min)) * 100));
  }
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: C.earth }}>{iconSem(s)} {label}</span>
        {s && <span style={{ fontSize: 11, color: colorSem(s), fontWeight: 700 }}>{labelSem(s)}</span>}
      </div>
      {pct !== null && (
        <div style={{ background: "#DDD5C4", borderRadius: 6, height: 10, position: "relative", marginBottom: 4 }}>
          {r && (() => {
            const [lo, hi] = r.ideal;
            const min = lo * 0.5; const max = hi * 1.5;
            const loPct = ((lo - min) / (max - min)) * 100;
            const hiPct = ((hi - min) / (max - min)) * 100;
            return <div style={{ position: "absolute", left: `${loPct}%`, width: `${hiPct - loPct}%`, top: 0, bottom: 0, background: C.mist, borderRadius: 6 }} />;
          })()}
          <div style={{ position: "absolute", left: `${Math.min(pct, 96)}%`, top: -3, width: 6, height: 16, background: colorSem(s), borderRadius: 3, transform: "translateX(-50%)", boxShadow: "0 1px 3px rgba(0,0,0,0.3)" }} />
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between" }}>
        <span style={{ fontSize: 12, color: C.bark, fontWeight: 600 }}>{valor !== "" ? `Tu valor: ${valor} ${r?.unidad || ""}` : "Sin dato aún"}</span>
        {r && <span style={{ fontSize: 10, color: C.bark }}>Ideal: {r.ideal[0]}–{r.ideal[1]} {r.unidad}</span>}
      </div>
    </div>
  );
}

// Campo de texto con teclado correcto por tipo
function Campo({ label, name, value, onChange, inputMode = "decimal", placeholder, ayuda, min, max, step = "0.1", tipo = "number" }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <label style={{ display: "block", fontSize: 14, fontWeight: 700, color: C.earth, marginBottom: 5 }}>{label}</label>
      {ayuda && <p style={{ fontSize: 12, color: C.bark, marginBottom: 8, lineHeight: 1.55 }}>{ayuda}</p>}
      <input
        type={tipo}
        inputMode={inputMode}
        value={value}
        onChange={e => onChange(name, e.target.value)}
        placeholder={placeholder || "—"}
        min={min} max={max} step={step}
        style={{
          width: "100%", padding: "13px 16px",
          border: `2px solid ${value ? C.clay : "#D4C4B0"}`,
          borderRadius: 10, fontSize: 16,
          background: C.white, color: C.earth,
          outline: "none", fontFamily: "inherit",
          transition: "border-color 0.2s",
        }}
        onFocus={e => e.target.style.borderColor = C.roast}
        onBlur={e => e.target.style.borderColor = value ? C.clay : "#D4C4B0"}
      />
    </div>
  );
}

// Selector tipo botones grandes (más fácil en táctil que input numérico para opciones acotadas)
function SelectorBotones({ label, name, value, onChange, opciones, ayuda }) {
  return (

// ── DESCARGA DE UN DIAGNÓSTICO COMO WORD (.docx generado en el navegador) ─────
const INDICADORES_WORD = [
  ["altitud", "Altitud"], ["pctRojos", "% frutos rojos"], ["puntajeSCA", "Puntaje SCA"],
  ["fermentacion", "Fermentación"], ["relacionCereza", "Relación cereza:pergamino"],
  ["humedadPergamino", "Humedad pergamino"], ["hrAlmacen", "HR bodega"],
  ["mermaTrilla", "Merma trilla"], ["pctPasilla", "% pasilla"], ["ph", "pH del suelo"],
];

async function descargarWordDiagnostico(d, code) {
  const recs = generarRecomendaciones(d);
  let bm = null;
  try { bm = await apiGet("/benchmark", code); } catch {}
  const { Document, Packer, Paragraph, TextRun, HeadingLevel } = window.docx;
  const W = { earth: "2C1810", roast: "5C3A21", bark: "8B5E3C", alert: "C0392B", warn: "D4851A", ok: "3A5C2A" };
  const colorPrioridad = p => p === 1 ? W.alert : p === 2 ? W.warn : W.ok;
  const textoPrioridad = p => p === 1 ? "Prioridad alta" : p === 2 ? "Prioridad media" : "Mantener";

  const filaIndicador = (label, campo) => {
    const valor = d[campo];
    const r = REF[campo];
    const texto = (valor !== "" && valor !== undefined && valor !== null) ? `${valor} ${r?.unidad || ""}` : "Sin dato";
    const ideal = r ? `  (ideal: ${r.ideal[0]}–${r.ideal[1]} ${r.unidad})` : "";
    return new Paragraph({ spacing: { after: 60 }, children: [
      new TextRun({ text: label + ": ", bold: true, color: W.roast, size: 20 }),
      new TextRun({ text: texto, size: 20, color: W.earth }),
      new TextRun({ text: ideal, size: 16, color: W.bark }),
    ] });
  };

  const recParrafos = recs.flatMap(r => [
    new Paragraph({ spacing: { before: 160, after: 40 }, children: [
      new TextRun({ text: `${textoPrioridad(r.prioridad)} · ${r.area}`, bold: true, color: colorPrioridad(r.prioridad), size: 18 }),
    ] }),
    new Paragraph({ spacing: { after: 30 }, children: [ new TextRun({ text: r.titulo, bold: true, size: 22, color: W.earth }) ] }),
    new Paragraph({ children: [ new TextRun({ text: r.texto, size: 20, color: W.roast }) ] }),
  ]);

  const sueloTexto = [
    d.tipoSuelo ? `Suelo ${d.tipoSuelo.toLowerCase()}` : "",
    d.humedadSuelo ? `humedad habitual: ${d.humedadSuelo.toLowerCase()}` : "",
    d.regimenLluvias ? `lluvias: ${d.regimenLluvias}` : "",
    d.pctSombra !== "" && d.pctSombra !== undefined ? `sombra: ${d.pctSombra}%${d.especiesSombra ? " (" + d.especiesSombra + ")" : ""}` : "",
  ].filter(Boolean).join(" · ");

  const plagasNombres = (d.plagasObservadas || []).map(id => PLAGAS.find(p => p.id === id)?.nombre).filter(Boolean);

  const precioFNC = bm?.precioFNCPorKilogramo || 23768;
  const kgBase = parseFloat(d.kgPergaminoCosecha) > 0 ? parseFloat(d.kgPergaminoCosecha) : 100;
  const pctPas = parseFloat(d.pctPasilla) || 0;
  const pctPrecioPas = parseFloat(d.pctPrecioPasilla) || 0;
  const ingresoIdeal = kgBase * precioFNC;
  const ingresoReal = kgBase * (1 - pctPas / 100) * precioFNC + kgBase * (pctPas / 100) * precioFNC * (pctPrecioPas / 100);
  const mermaCOP = ingresoIdeal - ingresoReal;
  const mermaPct = ingresoIdeal > 0 ? (mermaCOP / ingresoIdeal * 100) : 0;
  const fmtCOPw = n => "$" + Math.round(n).toLocaleString("es-CO");

  const doc = new Document({ sections: [{ children: [
    new Paragraph({ heading: HeadingLevel.HEADING_1, children: [ new TextRun({ text: `Diagnóstico de Finca #${d.numero}${d.nombre ? " — " + d.nombre : ""}` }) ] }),
    new Paragraph({ children: [ new TextRun({ text: `Código: ${code}${d.vereda ? " · " + d.vereda : ""}${d.altitud ? " · " + d.altitud + " msnm" : ""}`, color: W.bark, size: 20 }) ] }),
    new Paragraph({ children: [ new TextRun({ text: `Actualizado: ${d.actualizadoEn || "—"}`, color: W.bark, size: 18 }) ] }),
    new Paragraph({ text: "" }),
    new Paragraph({ heading: HeadingLevel.HEADING_2, children: [ new TextRun({ text: "Indicadores" }) ] }),
    ...INDICADORES_WORD.map(([campo, label]) => filaIndicador(label, campo)),
    new Paragraph({ text: "" }),
    new Paragraph({ heading: HeadingLevel.HEADING_2, children: [ new TextRun({ text: "Suelo y clima" }) ] }),
    new Paragraph({ children: [ new TextRun({ text: sueloTexto || "Sin datos de suelo/clima registrados", size: 20, color: W.roast }) ] }),
    new Paragraph({ text: "" }),
    new Paragraph({ heading: HeadingLevel.HEADING_2, children: [ new TextRun({ text: "Plagas y enfermedades observadas" }) ] }),
    new Paragraph({ children: [ new TextRun({ text: plagasNombres.length > 0 ? plagasNombres.join(", ") : "Ninguna marcada", size: 20, color: W.roast }) ] }),
    ...(d.notasFitosanitarias ? [new Paragraph({ children: [ new TextRun({ text: d.notasFitosanitarias, size: 18, color: W.bark }) ] })] : []),
    new Paragraph({ text: "" }),
    new Paragraph({ heading: HeadingLevel.HEADING_2, children: [ new TextRun({ text: "Áreas de mejora detectadas" }) ] }),
    ...recParrafos,
    new Paragraph({ text: "" }),
    new Paragraph({ heading: HeadingLevel.HEADING_2, children: [ new TextRun({ text: "Simulación económica de mermas" }) ] }),
    new Paragraph({ children: [ new TextRun({ text: `Ingreso si todo fuera primera (precio FNC ref.): ${fmtCOPw(ingresoIdeal)}`, size: 20, color: W.earth }) ] }),
    new Paragraph({ children: [ new TextRun({ text: `Ingreso real estimado: ${fmtCOPw(ingresoReal)}`, size: 20, color: W.earth }) ] }),
    new Paragraph({ children: [ new TextRun({ text: `Merma económica por pasilla: ${fmtCOPw(mermaCOP)} (${mermaPct.toFixed(1)}%)`, bold: true, size: 22, color: W.alert }) ] }),
    new Paragraph({ text: "" }),
    new Paragraph({ children: [ new TextRun({ text: "Referencias: Cenicafé · Federación Nacional de Cafeteros · SCA", size: 16, color: W.bark }) ] }),
  ] }] });

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `diagnostico-${code}-${d.numero}.docx`; a.click();
  URL.revokeObjectURL(url);
}

function Login({ onLogin }) {
  const [codigo, setCodigo] = useState("");

  const [error, setError] = useState("");

  const entrar = async () => {
    const c = codigo.trim().toUpperCase();
    if (!c) { setError("Escribe tu código"); return; }
    setCargando(true); setError("");
    try {
      const who = await apiGet("/whoami", c);
      onLogin(who.code);
    } catch (e) {
      setError("Código no reconocido. Verifica con tu formador.");
    } finally { setCargando(false); }
  };

  return (
    <div style={{ minHeight: "100vh", background: C.cream, maxWidth: 480, margin: "0 auto",
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>

          borderRadius: 10, fontSize: 18, textAlign: "center", textTransform: "uppercase",

        cursor: "pointer", opacity: cargando ? 0.7 : 1,

    </div>
  );
}

  ];
  const opcSombra = [
    {valor:"0",label:"Sin sombra (0%)"},{valor:"20",label:"Rala (10-20%)"},
    {valor:"30",label:"Media (20-40%)"},{valor:"50",label:"Densa (+40%)"},
  ];

  return (
    <div style={{ minHeight: "100vh", background: C.cream, maxWidth: 480, margin: "0 auto", position: "relative" }}>

      {/* HEADER */}
      <div className="header-safe" style={{ background: C.earth, paddingLeft: 20, paddingRight: 20, paddingBottom: 14, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, paddingTop: 4 }}>
          <span style={{ fontSize: 24 }}>☕</span>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 10, color: C.clay, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase" }}>Ubuntu Café · San Adolfo, Huila</div>
            <div style={{ fontSize: 16, color: C.cream, fontWeight: 900 }}>Diagnóstico #{entrada.numero}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 11, color: C.cream, fontWeight: 800, background: "#4A2A14", borderRadius: 6, padding: "3px 8px" }}>{code}</div>
            <div style={{ fontSize: 9, color: C.clay, marginTop: 3 }}>{guardando ? "Guardando…" : "✓ Guardado"}</div>
            <span onClick={onVolver} style={{ fontSize: 9, color: "#8B6B5A", textDecoration: "underline", cursor: "pointer" }}>← Mis diagnósticos</span>
          </div>
        </div>
        {/* Barra de progreso */}
        <div style={{ background: "#4A2A14", borderRadius: 4, height: 5, marginBottom: 8 }}>
          <div style={{ height: 5, borderRadius: 4, background: C.clay, width: `${progreso}%`, transition: "width 0.4s ease" }} />
        </div>
        {/* Pasos clickables */}
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          {SECCIONES.map((s, i) => (
            <span key={s} onClick={() => i < paso && setPaso(i)}
              style={{ fontSize: 9, fontWeight: i === paso ? 900 : 400,
                color: i === paso ? C.cream : i < paso ? C.clay : "#6B4030",
                cursor: i < paso ? "pointer" : "default", letterSpacing: 0.3 }}>{s}</span>
          ))}
        </div>
      </div>

      {/* CONTENIDO */}
      <div className="scroll-area seccion" style={{ padding: "24px 20px 120px" }} key={paso}>

        {/* ── PASO 0: FINCA ── */}
        {paso === 0 && <>
          <SeccionHeader numero="1" titulo="Tu finca" subtitulo="Datos básicos para contextualizar tu diagnóstico" />
          <Campo label="Nombre de la finca" name="nombre" value={datos.nombre} onChange={set}
            tipo="text" inputMode="text" placeholder="Ej. Finca El Porvenir" />
          <Campo label="Vereda" name="vereda" value={datos.vereda} onChange={set}
            tipo="text" inputMode="text" placeholder="Ej. La Cristalina" />
          <Campo label="Altitud (msnm)" name="altitud" value={datos.altitud} onChange={set}
            inputMode="numeric" placeholder="Ej. 1520" min={800} max={2500} step="10"
            ayuda="San Adolfo está entre 1.350 y 1.700 msnm. La altitud influye en la acidez y el perfil de taza." />
          <Campo label="Variedad principal" name="variedad" value={datos.variedad} onChange={set}
            tipo="text" inputMode="text" placeholder="Ej. Castillo, Caturra, Colombia" />
          <Campo label="Hectáreas en café" name="hectareas" value={datos.hectareas} onChange={set}
            inputMode="decimal" placeholder="Ej. 2.5" min={0.1} max={50} step="0.5" />
          {datos.altitud && (
            <div style={{ background: C.fog, borderRadius: 12, padding: 14, marginTop: 4 }}>
              <IndicadorBar label="Altitud" valor={datos.altitud} campo="altitud" />
            </div>
          )}
        </>}

        {/* ── PASO 1: COSECHA ── */}
        {paso === 1 && <>
          <SeccionHeader numero="2" titulo="Cosecha" subtitulo="La madurez del fruto es la palanca de mayor impacto sobre calidad y merma" />
          <TipBox titulo="¿Cómo saber tu % de frutos rojos?" texto="Coge 100 cerezas al azar de diferentes plantas. Cuenta cuántas están completamente rojas (color cereza uniforme). Ese número es tu porcentaje." />
          <SelectorBotones label="% de frutos rojos en tu cosecha" name="pctRojos" value={datos.pctRojos} onChange={set}
            opciones={opcRojos}
            ayuda="¿Qué porcentaje de los frutos que recoges en un día típico están en punto de madurez completa?" />
          <Campo label="Puntaje SCA (opcional)" name="puntajeSCA" value={datos.puntajeSCA} onChange={set}
            inputMode="decimal" placeholder="Ej. 82.5" min={60} max={100} step="0.25"
            ayuda="Si nunca han catado tu café, deja este campo vacío. Si tienes un dato de catación anterior, introdúcelo." />
          <div style={{ background: C.fog, borderRadius: 12, padding: 14 }}>
            <IndicadorBar label="% frutos rojos en cosecha" valor={datos.pctRojos} campo="pctRojos" />
            {datos.puntajeSCA !== "" && <IndicadorBar label="Puntaje SCA" valor={datos.puntajeSCA} campo="puntajeSCA" />}
          </div>
        </>}

        {/* ── PASO 2: BENEFICIO ── */}
        {paso === 2 && <>
          <SeccionHeader numero="3" titulo="Beneficio húmedo" subtitulo="Fermentación y despulpado definen si el café tendrá defectos en taza" />
          <SelectorBotones label="Tiempo de fermentación" name="fermentacion" value={datos.fermentacion} onChange={set}
            opciones={opcFerm}
            ayuda="¿Cuántas horas deja fermentando el café baboso antes de lavarlo?" />
          <Campo label="Relación conversión cereza → pergamino (:1)" name="relacionCereza" value={datos.relacionCereza} onChange={set}
            inputMode="decimal" placeholder="Ej. 5.2" min={3} max={8} step="0.1"
            ayuda="Divide los kg de cereza recogidos entre los kg de pergamino seco obtenidos. Ej: 500 kg cereza ÷ 96 kg pergamino = 5,2" />
          <div style={{ background: C.fog, borderRadius: 12, padding: 14 }}>
            <IndicadorBar label="Tiempo de fermentación" valor={datos.fermentacion} campo="fermentacion" />
            <IndicadorBar label="Relación cereza:pergamino" valor={datos.relacionCereza} campo="relacionCereza" />
          </div>
        </>}

        {/* ── PASO 3: SECADO ── */}
        {paso === 3 && <>
          <SeccionHeader numero="4" titulo="Secado y almacenamiento" subtitulo="La humedad final determina pérdida de peso y riesgo de hongos" />
          <TipBox titulo="¿No tienes medidor de humedad?" texto="El pergamino entre 10-12% de humedad suena 'crujiente' y duro al apretarlo entre los dedos. Si se siente blando o flexible, aún está húmedo." />
          <SelectorBotones label="Humedad del pergamino seco (%)" name="humedadPergamino" value={datos.humedadPergamino} onChange={set}
            opciones={opcHumPerg}
            ayuda="Selecciona la humedad aproximada de tu café pergamino al finalizar el secado." />
          <Campo label="Humedad relativa de la bodega (%HR)" name="hrAlmacen" value={datos.hrAlmacen} onChange={set}
            inputMode="numeric" placeholder="Ej. 65" min={30} max={100} step="1"
            ayuda="Bodega seca + ventilada + separada del suelo ≈ 60-70%. Bodega húmeda o junto a cocina puede superar el 80%." />
          <div style={{ background: C.fog, borderRadius: 12, padding: 14 }}>
            <IndicadorBar label="Humedad pergamino seco" valor={datos.humedadPergamino} campo="humedadPergamino" />
            <IndicadorBar label="Humedad relativa bodega" valor={datos.hrAlmacen} campo="hrAlmacen" />
          </div>
        </>}

        {/* ── PASO 4: TRILLA ── */}
        {paso === 4 && <>
          <SeccionHeader numero="5" titulo="Trilla" subtitulo="La merma y el % de pasilla revelan la calidad acumulada de todo el proceso" />
          <Campo label="Merma en trilla (%)" name="mermaTrilla" value={datos.mermaTrilla} onChange={set}
            inputMode="decimal" placeholder="Ej. 19" min={10} max={35} step="0.5"
            ayuda="Dato que da el trillador: diferencia entre kg de pergamino que entran y kg de almendra que salen. Estándar FNC = 19%." />
          <Campo label="% de pasilla en trilla" name="pctPasilla" value={datos.pctPasilla} onChange={set}
            inputMode="decimal" placeholder="Ej. 6" min={0} max={30} step="0.5"
            ayuda="Grano partido, negro o manchado que el trillador separa del café de primera. Pídele este dato al trillador por lote." />
          <div style={{ background: C.fog, borderRadius: 12, padding: 14 }}>
            <IndicadorBar label="Merma en trilla" valor={datos.mermaTrilla} campo="mermaTrilla" />
            <IndicadorBar label="% pasilla" valor={datos.pctPasilla} campo="pctPasilla" />
          </div>
        </>}

        {/* ── PASO 5: SUELO Y CLIMA ── */}
        {paso === 5 && <>
          <SeccionHeader numero="6" titulo="Suelo y clima" subtitulo="Las condiciones de suelo y clima de esta variedad influyen en nutrición, sanidad y calidad final" />
          <SelectorBotones label="Tipo de suelo" name="tipoSuelo" value={datos.tipoSuelo} onChange={set}
            opciones={opcTipoSuelo}
            ayuda="Si tienes un análisis de suelo reciente, usa ese dato. Si no, una estimación a ojo/tacto sirve." />
          <Campo label="pH del suelo (si lo conoces)" name="ph" value={datos.ph} onChange={set}
            inputMode="decimal" placeholder="Ej. 5.2" min={3.5} max={8} step="0.1"
            ayuda="Dato de análisis de suelo del ICA, Cenicafé o tu cooperativa. El café prefiere suelos ligeramente ácidos (5,0-5,5)." />
          <SelectorBotones label="Humedad del suelo (situación habitual)" name="humedadSuelo" value={datos.humedadSuelo} onChange={set} opciones={opcHumedadSuelo} />
          <SelectorBotones label="Régimen de lluvias de la zona" name="regimenLluvias" value={datos.regimenLluvias} onChange={set} opciones={opcRegimenLluvias} />
          <SelectorBotones label="% de sombra sobre el cafetal" name="pctSombra" value={datos.pctSombra} onChange={set}
            opciones={opcSombra}
            ayuda="Estima qué porcentaje del cafetal queda cubierto por árboles de sombra al mediodía." />
          <Campo label="Especies de sombra (opcional)" name="especiesSombra" value={datos.especiesSombra} onChange={set}
            tipo="text" inputMode="text" placeholder="Ej. Guamo, Nogal, Cedro" />
          {datos.ph && (
            <div style={{ background: C.fog, borderRadius: 12, padding: 14, marginTop: 4 }}>
              <IndicadorBar label="pH del suelo" valor={datos.ph} campo="ph" />
            </div>
          )}
        </>}

        {/* ── PASO 6: PLAGAS Y ENFERMEDADES ── */}
        {paso === 6 && <>
          <SeccionHeader numero="7" titulo="Plagas y enfermedades" subtitulo="Marca lo que has observado en esta cosecha. Toca cada tarjeta para ver síntomas, umbral de acción y control recomendado (Cenicafé/FNC)." />
          <CatalogoPlagas seleccionadas={datos.plagasObservadas} onToggle={togglePlaga} />
          <div style={{ marginTop: 16 }}>
            <label style={{ display: "block", fontSize: 14, fontWeight: 700, color: C.earth, marginBottom: 5 }}>Notas adicionales (opcional)</label>
            <textarea value={datos.notasFitosanitarias} onChange={e => set("notasFitosanitarias", e.target.value)} rows={3}
              placeholder="Ej. La roya apareció solo en el lote de abajo, cerca de la quebrada"
              style={{ width: "100%", padding: "13px 16px", border: `2px solid ${C.clay}`, borderRadius: 10, fontSize: 14, background: C.white, color: C.earth, outline: "none", resize: "vertical", fontFamily: "inherit" }} />
          </div>
        </>}

        {/* ── PASO 7: DIAGNÓSTICO ── */}
        {paso === 7 && <>
          <div style={{ textAlign: "center", marginBottom: 24 }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>🌿</div>
            <h2 style={{ margin: 0, fontSize: 22, fontWeight: 900, color: C.earth }}>{datos.nombre || "Tu finca"}</h2>
            {(datos.vereda || datos.altitud) && (
              <p style={{ margin: "5px 0 0", fontSize: 13, color: C.bark }}>
                {[datos.vereda, datos.altitud ? `${datos.altitud} msnm` : ""].filter(Boolean).join(" · ")}
              </p>
            )}
          </div>

          {/* Resumen indicadores */}
          <div style={{ background: C.fog, borderRadius: 14, padding: 16, marginBottom: 24 }}>
            <h3 style={{ margin: "0 0 16px", fontSize: 12, fontWeight: 900, color: C.roast, textTransform: "uppercase", letterSpacing: 1 }}>
              Resumen de indicadores
            </h3>
            <IndicadorBar label="Altitud" valor={datos.altitud} campo="altitud" />
            <IndicadorBar label="% frutos rojos en cosecha" valor={datos.pctRojos} campo="pctRojos" />
            {datos.puntajeSCA !== "" && <IndicadorBar label="Puntaje SCA" valor={datos.puntajeSCA} campo="puntajeSCA" />}
            <IndicadorBar label="Fermentación" valor={datos.fermentacion} campo="fermentacion" />
            <IndicadorBar label="Relación cereza:pergamino" valor={datos.relacionCereza} campo="relacionCereza" />
            <IndicadorBar label="Humedad pergamino" valor={datos.humedadPergamino} campo="humedadPergamino" />
            <IndicadorBar label="HR bodega" valor={datos.hrAlmacen} campo="hrAlmacen" />
            <IndicadorBar label="Merma trilla" valor={datos.mermaTrilla} campo="mermaTrilla" />
            <IndicadorBar label="% pasilla" valor={datos.pctPasilla} campo="pctPasilla" />
            {datos.ph !== "" && <IndicadorBar label="pH del suelo" valor={datos.ph} campo="ph" />}
          </div>

          {(datos.tipoSuelo || datos.pctSombra || datos.regimenLluvias) && (
            <div style={{ background: C.white, borderRadius: 14, padding: 16, marginBottom: 24 }}>
              <h3 style={{ margin: "0 0 10px", fontSize: 12, fontWeight: 900, color: C.roast, textTransform: "uppercase", letterSpacing: 1 }}>🌱 Suelo y clima</h3>
              <div style={{ fontSize: 13, color: C.roast, lineHeight: 1.7 }}>
                {datos.tipoSuelo && <div>Suelo {datos.tipoSuelo.toLowerCase()}{datos.humedadSuelo ? `, habitualmente ${datos.humedadSuelo.toLowerCase()}` : ""}</div>}
                {datos.regimenLluvias && <div>Régimen de lluvias: {datos.regimenLluvias}</div>}
                {datos.pctSombra !== "" && <div>Sombra: {opcSombra.find(o => o.valor === datos.pctSombra)?.label || datos.pctSombra + "%"}{datos.especiesSombra ? ` (${datos.especiesSombra})` : ""}</div>}
              </div>
            </div>
          )}

          {datos.plagasObservadas.length > 0 && (
            <div style={{ background: C.white, borderRadius: 14, padding: 16, marginBottom: 24 }}>
              <h3 style={{ margin: "0 0 10px", fontSize: 12, fontWeight: 900, color: C.roast, textTransform: "uppercase", letterSpacing: 1 }}>🌿 Fitosanitario observado</h3>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {datos.plagasObservadas.map(id => {
                  const p = PLAGAS.find(x => x.id === id);
                  if (!p) return null;
                  return <span key={id} style={{ fontSize: 11, fontWeight: 700, color: C.roast, background: C.fog, borderRadius: 8, padding: "3px 9px" }}>{p.icon} {p.nombre}</span>;
                })}
              </div>
              {datos.notasFitosanitarias && <p style={{ fontSize: 12, color: C.bark, marginTop: 8, lineHeight: 1.5 }}>{datos.notasFitosanitarias}</p>}
            </div>
          )}

          {/* Recomendaciones */}
          <h3 style={{ margin: "0 0 14px", fontSize: 12, fontWeight: 900, color: C.roast, textTransform: "uppercase", letterSpacing: 1 }}>
            Áreas de mejora detectadas
          </h3>
          {recs.map((r, i) => (
            <div key={i} style={{ background: C.white, borderRadius: 14, padding: 16, marginBottom: 14,
              borderLeft: `4px solid ${prioridadColor(r.prioridad)}`, boxShadow: "0 2px 8px rgba(0,0,0,0.07)" }}>
              <div style={{ fontSize: 11, fontWeight: 800, color: prioridadColor(r.prioridad), marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.8 }}>
                {prioridadLabel(r.prioridad)} · {r.area}
              </div>
              <div style={{ fontSize: 15, fontWeight: 800, color: C.earth, marginBottom: 8, lineHeight: 1.3 }}>{r.titulo}</div>
              <div style={{ fontSize: 13, color: C.roast, lineHeight: 1.65, marginBottom: 10 }}>{r.texto}</div>
              <div style={{ fontSize: 12, color: C.bark, fontStyle: "italic", paddingTop: 8, borderTop: `1px solid ${C.fog}` }}>
                💡 {r.impacto}
              </div>
            </div>
          ))}

          {/* Simulación económica */}
          <h3 style={{ margin: "24px 0 14px", fontSize: 12, fontWeight: 900, color: C.roast, textTransform: "uppercase", letterSpacing: 1 }}>
            💰 Simulación económica de mermas
          </h3>
          <div style={{ background: C.white, borderRadius: 14, padding: 16, marginBottom: 16 }}>
            <p style={{ fontSize: 12, color: C.bark, lineHeight: 1.55, marginBottom: 14 }}>
              Estima cuánto te cuesta la pasilla de esta cosecha frente a vender todo a precio estándar. Ajusta los supuestos si los conoces.
            </p>
            <Campo label="Kg de pergamino de esta cosecha (opcional)" name="kgPergaminoCosecha" value={datos.kgPergaminoCosecha} onChange={set}
              inputMode="decimal" placeholder="Si lo dejas vacío, se simula sobre 100 kg" min={0} max={50000} step="1" />
            <Campo label="% del precio estándar que recibes por la pasilla" name="pctPrecioPasilla" value={datos.pctPrecioPasilla} onChange={set}
              inputMode="numeric" placeholder="Ej. 30" min={0} max={100} step="5"
              ayuda="La pasilla casi siempre se vende mucho más barata que el café de primera, o se autoconsume. Ajusta según lo que te pagan a ti." />
            {(() => {
              const precioFNC = bm?.precioFNCPorKilogramo || 23768;
              const kgBase = parseFloat(datos.kgPergaminoCosecha) > 0 ? parseFloat(datos.kgPergaminoCosecha) : 100;
              const pctPas = parseFloat(datos.pctPasilla) || 0;
              const pctPrecioPas = parseFloat(datos.pctPrecioPasilla) || 0;
              const kgPrimera = kgBase * (1 - pctPas / 100);
              const kgPasilla = kgBase * (pctPas / 100);
              const ingresoIdeal = kgBase * precioFNC;
              const ingresoReal = kgPrimera * precioFNC + kgPasilla * precioFNC * (pctPrecioPas / 100);
              const mermaCOP = ingresoIdeal - ingresoReal;
              const mermaPct = ingresoIdeal > 0 ? (mermaCOP / ingresoIdeal * 100) : 0;
              const fmtCOP = n => "$" + Math.round(n).toLocaleString("es-CO");
              return (
                <div style={{ background: C.fog, borderRadius: 12, padding: 14, marginTop: 6 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.clay}` }}>
                    <span style={{ fontSize: 12, color: C.earth }}>Ingreso si todo fuera primera (precio FNC ref.)</span>
                    <strong style={{ fontSize: 13, color: C.earth }}>{fmtCOP(ingresoIdeal)}</strong>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.clay}` }}>
                    <span style={{ fontSize: 12, color: C.earth }}>Ingreso real estimado ({fmt0(kgPrimera)} kg primera + {fmt0(kgPasilla)} kg pasilla)</span>
                    <strong style={{ fontSize: 13, color: C.earth }}>{fmtCOP(ingresoReal)}</strong>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0 2px" }}>
                    <span style={{ fontSize: 13, fontWeight: 800, color: C.alert }}>Merma económica por pasilla</span>
                    <strong style={{ fontSize: 15, fontWeight: 900, color: C.alert }}>{fmtCOP(mermaCOP)} ({mermaPct.toFixed(1)}%)</strong>
                  </div>
                </div>
              );
            })()}
            {datos.puntajeSCA !== "" && parseFloat(datos.puntajeSCA) >= 80 && (
              <div style={{ background: "#E8F5E8", borderRadius: 10, padding: 12, marginTop: 12 }}>
                <p style={{ fontSize: 12, color: C.leaf, lineHeight: 1.55 }}>
                  ☕ Con {datos.puntajeSCA} puntos SCA tu café califica como especialidad. Referencialmente, cada punto por encima de 80 puede representar entre +0,20 y +0,50 USD/lb adicionales frente al precio convencional (FNC/SCA, referencia de mercado, varía según comprador y momento).
                </p>
              </div>
            )}
          </div>

          <div style={{ background: C.earth, borderRadius: 14, padding: 16, marginTop: 24, textAlign: "center" }}>
            <div style={{ fontSize: 11, color: C.clay, marginBottom: 4, fontWeight: 700 }}>Referencias técnicas</div>
            <div style={{ fontSize: 11, color: "#8B6B5A", lineHeight: 1.7 }}>
              Cenicafé · Federación Nacional de Cafeteros<br/>SCA · Specialty Transaction Guide 2024/25
            </div>
          </div>

          <button onClick={() => descargarWordDiagnostico(datos, code)} style={{
            width: "100%", marginTop: 16, borderRadius: 12, border: `1.5px solid ${C.leaf}`, padding: "12px 0",
            background: "transparent", color: C.leaf, fontSize: 13, fontWeight: 800, cursor: "pointer",
          }}>📄 Descargar este diagnóstico en Word</button>
        </>}
      </div>

      {/* NAVEGACIÓN FIJA */}
      <div className="nav-safe" style={{
        position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
        width: "100%", maxWidth: 480, background: C.white,
        paddingTop: 12, paddingLeft: 20, paddingRight: 20,
        borderTop: `1px solid ${C.fog}`,
        display: "flex", gap: 12,
        boxShadow: "0 -4px 16px rgba(0,0,0,0.08)",
      }}>
        {paso > 0 && (
          <button onClick={() => setPaso(p => p - 1)} style={{
            flex: 1, borderRadius: 12, border: `2px solid ${C.clay}`,
            background: "transparent", color: C.roast,
            fontSize: 15, fontWeight: 700, cursor: "pointer",
          }}>← Atrás</button>
        )}
        {paso < SECCIONES.length - 1 ? (
          <button onClick={() => setPaso(p => p + 1)} style={{
            flex: 2, borderRadius: 12, border: "none",
            background: C.roast, color: C.cream,
            fontSize: 15, fontWeight: 900, cursor: "pointer",
          }}>
            {paso === SECCIONES.length - 2 ? "Ver diagnóstico →" : "Continuar →"}
          </button>
        ) : (
          <button onClick={onVolver} style={{
            flex: 2, borderRadius: 12, border: "none",
            background: C.leaf, color: C.cream,
            fontSize: 15, fontWeight: 900, cursor: "pointer",
          }}>✓ Volver a mis diagnósticos</button>
        )}
      </div>
    </div>
  );
}

// ── CONTENEDOR: gestiona la lista de diagnósticos de este código y la navegación
// entre la lista y el formulario de un diagnóstico concreto ──────────────────
function Contenedor({ code, onLogout }) {
  const [diagnosticos, setDiagnosticos] = useState([]);
  const [cargado, setCargado] = useState(false);
  const [idActivo, setIdActivo] = useState(null);

  const cargar = useCallback(() => {
    apiGet("/diagnostico", code)
      .then(d => setDiagnosticos(d?.diagnosticos || []))
      .catch(() => setDiagnosticos([]))
      .finally(() => setCargado(true));
  }, [code]);

  useEffect(() => { cargar(); }, [cargar]);

  const nuevoDiagnostico = useCallback(async () => {
    try {
      const nuevo = await apiPost("/diagnostico", code, {});
      setDiagnosticos(d => [...d, nuevo]);
      setIdActivo(nuevo.id);
    } catch (e) { /* el toast de error ya lo muestra apiPost vía throw; aquí no hay toast global */ }
  }, [code]);

  const abrir = useCallback((id) => setIdActivo(id), []);
  const volver = useCallback(() => { setIdActivo(null); cargar(); }, [cargar]);

  const borrar = useCallback(async (id) => {
    if (!window.confirm("¿Borrar este diagnóstico? Esta acción no se puede deshacer.")) return;
    await apiDelete(`/diagnostico/${id}`, code).catch(() => {});
    cargar();
  }, [code, cargar]);

  const borrarTodos = useCallback(async () => {
    if (!window.confirm("¿Borrar TODOS tus diagnósticos? Esta acción no se puede deshacer.")) return;
    await apiDelete("/diagnostico", code).catch(() => {});
    cargar();
  }, [code, cargar]);

  if (!cargado) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.bark }}>Cargando…</div>;
  }

  if (idActivo) {
    const entrada = diagnosticos.find(d => d.id === idActivo);
    if (!entrada) { setIdActivo(null); return null; }
    return <DiagnosticoWizard code={code} entrada={entrada} onVolver={volver} />;
  }

  return <ListaDiagnosticos code={code} diagnosticos={diagnosticos}
    onNuevo={nuevoDiagnostico} onAbrir={abrir} onBorrar={borrar} onBorrarTodos={borrarTodos} onLogout={onLogout} />;
}

// ── APP raíz: gestiona el código guardado en este dispositivo ────────────────
function App() {
  const [code, setCode] = useState(() => localStorage.getItem("dfc_code") || "");

  const onLogin = (c) => { localStorage.setItem("dfc_code", c); setCode(c); };
  const onLogout = () => { localStorage.removeItem("dfc_code"); setCode(""); };

  return code ? <Contenedor code={code} onLogout={onLogout} /> : <Login onLogin={onLogin} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
